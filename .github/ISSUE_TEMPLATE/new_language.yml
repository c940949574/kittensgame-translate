name: Language request / claim
description: Ask for a language, or volunteer to translate one
labels: [language request]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "pt-BR — Brazilian Portuguese"
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Do you want to translate it?
      options: ["Yes, I'll open a PR", "Just requesting it"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Terminology sources, wiki links, anything helpful
