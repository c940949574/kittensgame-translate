name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate packs & build
        run: node tools/build.mjs

      - name: Syntax-check built userscripts
        run: |
          for f in dist/*.user.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: dist/ is up to date with locales/
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ 与 locales/ 不同步，请运行 node tools/build.mjs 后一并提交"
            git diff --stat dist/
            exit 1
          fi

      - name: Cross-check packs against the live dictionaries
        # 网络偶发失败不算失败：verify 已有本地缓存兜底
        run: node tools/verify.mjs || echo "::warning::词表校验未通过（可能是网络问题）"
